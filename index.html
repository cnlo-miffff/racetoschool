<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grammar Sprint: School Bell Race</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a1a;
            font-family: 'Press Start 2P', cursive;
            margin: 0;
            overflow: hidden;
            color: white;
        }
        canvas {
            image-rendering: pixelated;
            display: block;
            width: 100%;
            height: auto;
            max-height: 60vh;
        }
        .pixel-border {
            box-shadow: 
                0 -4px 0 0 #000,
                0 4px 0 0 #000,
                -4px 0 0 0 #000,
                4px 0 0 0 #000;
        }
        .btn-active:active {
            transform: translateY(4px);
        }
        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <!-- Game UI -->
    <div id="game-container" class="w-full max-w-4xl bg-blue-900 pixel-border relative overflow-hidden flex flex-col">
        
        <!-- Header / Progress -->
        <div class="p-4 bg-blue-800 border-b-4 border-black flex justify-between items-center text-[10px] md:text-xs">
            <div class="flex flex-col gap-2 w-1/3">
                <span id="p1-label">P1 (A/D)</span>
                <div class="w-full bg-gray-700 h-4 border-2 border-black">
                    <div id="p1-progress" class="bg-yellow-400 h-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>
            
            <div class="text-center">
                <div id="timer-display" class="text-2xl text-red-400">10</div>
                <div class="text-[8px]">SECONDS</div>
            </div>

            <div class="flex flex-col gap-2 w-1/3 items-end">
                <span id="p2-label">P2 (1/3)</span>
                <div class="w-full bg-gray-700 h-4 border-2 border-black">
                    <div id="p2-progress" class="bg-green-400 h-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- Main Stage -->
        <div class="relative bg-sky-300">
            <canvas id="gameCanvas"></canvas>
            
            <!-- Word Display Overlay -->
            <div id="word-overlay" class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                <div id="current-word-box" class="bg-white text-black px-6 py-4 pixel-border text-xl md:text-3xl mb-4 hidden">
                    <span id="current-word">TIME</span>
                </div>
                <div id="round-feedback" class="text-lg text-yellow-300 drop-shadow-md bg-black/40 px-4 py-1 rounded hidden"></div>
            </div>

            <!-- Start/End Overlay -->
            <div id="menu-overlay" class="absolute inset-0 bg-black bg-opacity-80 flex flex-col items-center justify-center z-20 p-8 text-center">
                <h1 class="text-2xl md:text-4xl mb-6 text-yellow-400">SCHOOL BELL RACE</h1>
                <p id="menu-text" class="text-[10px] md:text-sm mb-8 leading-relaxed">
                    FASTER CORRECT ANSWER WINS THE ROUND!<br><br>
                    PLAYER 1: [A] Countable | [D] Uncountable<br>
                    PLAYER 2: [1] Countable | [3] Uncountable<br><br>
                    Winner reaches the school door! Go!
                </p>
                <button id="start-btn" class="bg-yellow-500 hover:bg-yellow-400 text-black px-8 py-4 pixel-border btn-active">START RACE!</button>
            </div>
        </div>

        <!-- Footer / Legend -->
        <div class="p-4 bg-gray-900 border-t-4 border-black flex justify-between text-[8px] md:text-[10px]">
            <div class="text-blue-400">LEFT = COUNTABLE</div>
            <div class="text-yellow-500">SPEED IS EVERYTHING!</div>
            <div class="text-pink-400">RIGHT = UNCOUNTABLE</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const wordBox = document.getElementById('current-word-box');
        const wordText = document.getElementById('current-word');
        const timerDisplay = document.getElementById('timer-display');
        const p1Progress = document.getElementById('p1-progress');
        const p2Progress = document.getElementById('p2-progress');
        const menuOverlay = document.getElementById('menu-overlay');
        const startBtn = document.getElementById('start-btn');
        const feedback = document.getElementById('round-feedback');

        // Game Configuration
        const nouns = [
            { word: "TIME", type: "uncountable" },
            { word: "CONFIDENCE", type: "uncountable" },
            { word: "SLEEP", type: "uncountable" },
            { word: "PEOPLE", type: "countable" },
            { word: "TEENAGERS", type: "countable" }
        ];

        let gameState = 'MENU';
        let currentRound = 0;
        let timer = 10;
        let timerInterval;
        let p1Score = 0;
        let p2Score = 0;
        let p1Status = 'idle'; 
        let p2Status = 'idle';
        let frameCount = 0;

        let p1VisualX = 50;
        let p2VisualX = 50;

        let p1Locked = false;
        let p2Locked = false;
        let roundActive = false;

        function resize() {
            canvas.width = 800;
            canvas.height = 300;
        }
        window.addEventListener('resize', resize);
        resize();

        function drawCharacter(x, y, color, state, frame) {
            ctx.save();
            ctx.translate(x, y);
            
            const bounce = state === 'running' ? Math.sin(frame * 0.2) * 5 : (state === 'idle' ? Math.sin(frame * 0.1) * 2 : 0);
            const rotation = state === 'tripped' ? -Math.PI / 2 : 0;
            const offsetY = state === 'tripped' ? 20 : bounce;

            ctx.translate(0, offsetY);
            ctx.rotate(rotation);

            // Legs
            ctx.fillStyle = '#333';
            if (state === 'running') {
                const legMove = Math.sin(frame * 0.2) * 8;
                ctx.fillRect(-8, 20, 6, 10 + legMove); 
                ctx.fillRect(2, 20, 6, 10 - legMove);  
            } else {
                ctx.fillRect(-8, 20, 6, 10);
                ctx.fillRect(2, 20, 6, 10);
            }

            // Body
            ctx.fillStyle = color;
            ctx.fillRect(-12, 0, 24, 25);
            
            // Head
            ctx.fillStyle = '#ffdbac';
            ctx.fillRect(-10, -18, 20, 20);

            // Hair
            ctx.fillStyle = '#4b2c20';
            ctx.fillRect(-12, -22, 24, 8);

            // Eyes
            ctx.fillStyle = '#000';
            ctx.fillRect(-6, -12, 3, 3);
            ctx.fillRect(3, -12, 3, 3);

            ctx.restore();
        }

        function drawBackground() {
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Ground
            ctx.fillStyle = '#91d051';
            ctx.fillRect(0, 240, canvas.width, 60);
            
            // Road
            ctx.fillStyle = '#bcbcbc';
            ctx.fillRect(0, 250, canvas.width, 30);

            // School Building
            ctx.fillStyle = '#a52a2a';
            ctx.fillRect(700, 140, 100, 110);
            ctx.fillStyle = '#800000';
            ctx.fillRect(730, 190, 40, 60);
            ctx.fillStyle = '#333';
            ctx.fillRect(690, 135, 120, 10);
        }

        function gameLoop() {
            frameCount++;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBackground();

            let targetX1, targetX2;

            if (gameState === 'FINISHED') {
                // Winner (or tie leaders) runs to the door (750)
                // Loser stays at their score position
                const maxScore = Math.max(p1Score, p2Score);
                
                targetX1 = (p1Score === maxScore && p1Score > 0) ? 750 : (50 + (p1Score / nouns.length) * 600);
                targetX2 = (p2Score === maxScore && p2Score > 0) ? 750 : (50 + (p2Score / nouns.length) * 600);

                // Set status to running if not at door yet
                if (Math.abs(p1VisualX - targetX1) > 2) p1Status = 'running'; else p1Status = 'idle';
                if (Math.abs(p2VisualX - targetX2) > 2) p2Status = 'running'; else p2Status = 'idle';
            } else {
                targetX1 = 50 + (p1Score / nouns.length) * 600;
                targetX2 = 50 + (p2Score / nouns.length) * 600;
            }

            // Smoothly move visuals towards targets
            p1VisualX += (targetX1 - p1VisualX) * 0.05;
            p2VisualX += (targetX2 - p2VisualX) * 0.05;

            drawCharacter(p1VisualX, 240, '#facc15', p1Status, frameCount);
            drawCharacter(p2VisualX, 260, '#4ade80', p2Status, frameCount);

            requestAnimationFrame(gameLoop);
        }

        function startRound() {
            if (currentRound >= nouns.length) {
                endGame();
                return;
            }

            p1Locked = false;
            p2Locked = false;
            p1Status = 'idle';
            p2Status = 'idle';
            roundActive = true;
            
            wordText.textContent = nouns[currentRound].word;
            wordBox.classList.remove('hidden', 'shake');
            feedback.classList.add('hidden');
            
            timer = 10;
            timerDisplay.textContent = timer;
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timer--;
                timerDisplay.textContent = timer;
                if (timer <= 0) {
                    resolveRound(null, 'timeout');
                }
            }, 1000);
        }

        window.addEventListener('keydown', (e) => {
            if (!roundActive || gameState !== 'PLAYING') return;

            const correctType = nouns[currentRound].type;

            // Player 1
            if (!p1Locked) {
                if (e.key.toLowerCase() === 'a' || e.key.toLowerCase() === 'd') {
                    const choice = (e.key.toLowerCase() === 'a') ? 'countable' : 'uncountable';
                    if (choice === correctType) {
                        resolveRound(1, 'win');
                    } else {
                        p1Status = 'tripped';
                        p1Locked = true;
                        wordBox.classList.add('shake');
                        setTimeout(() => wordBox.classList.remove('shake'), 500);
                        checkAllFailed();
                    }
                }
            }

            // Player 2
            if (!p2Locked) {
                if (e.key === '1' || e.key === '3') {
                    const choice = (e.key === '1') ? 'countable' : 'uncountable';
                    if (choice === correctType) {
                        resolveRound(2, 'win');
                    } else {
                        p2Status = 'tripped';
                        p2Locked = true;
                        wordBox.classList.add('shake');
                        setTimeout(() => wordBox.classList.remove('shake'), 500);
                        checkAllFailed();
                    }
                }
            }
        });

        function checkAllFailed() {
            if (p1Locked && p2Locked) {
                resolveRound(null, 'both_fail');
            }
        }

        function resolveRound(winner, reason) {
            roundActive = false;
            clearInterval(timerInterval);

            if (winner === 1) {
                p1Score++;
                p1Status = 'running';
                p1Progress.style.width = (p1Score / nouns.length * 100) + "%";
                showFeedback("P1 WAS FASTER!");
            } else if (winner === 2) {
                p2Score++;
                p2Status = 'running';
                p2Progress.style.width = (p2Score / nouns.length * 100) + "%";
                showFeedback("P2 WAS FASTER!");
            } else if (reason === 'timeout') {
                showFeedback("TOO SLOW!");
            } else {
                showFeedback("BOTH TRIPPED!");
            }

            wordBox.classList.add('hidden');
            
            setTimeout(() => {
                currentRound++;
                startRound();
            }, 1000);
        }

        function showFeedback(msg) {
            feedback.textContent = msg;
            feedback.classList.remove('hidden');
        }

        function endGame() {
            gameState = 'FINISHED';
            
            // Wait for characters to finish their dash before showing the menu
            setTimeout(() => {
                menuOverlay.classList.remove('hidden');
                let winnerText = "IT'S A TIE!";
                if (p1Score > p2Score) winnerText = "PLAYER 1 REACHED SCHOOL!";
                if (p2Score > p1Score) winnerText = "PLAYER 2 REACHED SCHOOL!";
                
                menuOverlay.innerHTML = `
                    <h1 class="text-3xl mb-4 text-yellow-400">RACE COMPLETE!</h1>
                    <p class="text-lg mb-6">${winnerText}</p>
                    <div class="flex justify-center gap-10 mb-8">
                        <div>P1: ${p1Score}</div>
                        <div>P2: ${p2Score}</div>
                    </div>
                    <button onclick="location.reload()" class="bg-yellow-500 hover:bg-yellow-400 text-black px-8 py-4 pixel-border btn-active">REMATCH</button>
                `;
            }, 2000);
        }

        startBtn.addEventListener('click', () => {
            menuOverlay.classList.add('hidden');
            gameState = 'PLAYING';
            currentRound = 0;
            p1Score = 0;
            p2Score = 0;
            p1VisualX = 50;
            p2VisualX = 50;
            p1Progress.style.width = "0%";
            p2Progress.style.width = "0%";
            startRound();
        });

        // Initialize Loop
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
